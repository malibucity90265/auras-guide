<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0f14;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .aura {
      max-width: 420px;
      width: 90%;
      background: #111827;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }
    .bubble {
      background: #1f2937;
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 16px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

<div class="aura">
  <div class="bubble">
    Hi. I’m Aura.  
    Tell me what you need — I’ll handle the rest.
  </div>

  <div class="bubble" id="response" style="display:none;"></div>

  <input
    id="input"
    placeholder="Try: I want tacos from Jack in the Box"
    onkeydown="if(event.key==='Enter') respond()"
  />
</div>

<script>
  function respond() {
    const input = document.getElementById('input');
    const response = document.getElementById('response');
    const text = input.value.toLowerCase();

    let reply = "Got it.";

    if (text.includes("taco")) {
      reply = "Do you want them delivered or picked up from the closest location?";
    } else if (text.includes("flat tire")) {
      reply = "I’ve got you. I can call the nearest tire shop or roadside assistance.";
    } else if (text.includes("milan")) {
      reply = "Planning Milan. Flights, hotels, food, or experiences?";
    } else if (text.includes("help")) {
      reply = "Tell me what’s going on. I’ll take care of it.";
    }

    response.style.display = "block";
    response.innerText = reply;
    input.value = "";
  }
</script>

</body>
</html>
