<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aura</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
  <div class="header">Aura</div>

  <div id="chat" class="chat">
    <div class="aura">
      Hi. I’m Aura.  
      I can help you think, decide, or just get unstuck.
    </div>
  </div>

  <div class="input-area">
    <input id="userInput" placeholder="Say hello…" />
    <button onclick="send()">Send</button>
  </div>
</div>

<script src="aura.js"></script>
</body>
</html>
